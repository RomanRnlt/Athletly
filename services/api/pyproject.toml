[project]
name = "athletly-api"
version = "0.1.0"
description = "Athletly backend - skill-based multi-agent chat over litellm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "litellm>=1.52.0",
    "pydantic-ai>=0.0.13",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
    "garminconnect>=0.2.38",
    "supabase>=2.9.0",
    "pyjwt[crypto]>=2.10.0",
    "ddgs>=9.0.0",
]

[tool.uv]
package = false
