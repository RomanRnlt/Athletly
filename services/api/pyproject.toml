[project]
name = "athletly-api"
version = "0.1.0"
description = "Athletly v2 backend - pydantic-ai chat agent over litellm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-ai>=0.0.13",
    "litellm>=1.52.0",
    "python-dotenv>=1.0.1",
    "sse-starlette>=2.1.3",
    "httpx>=0.27.0",
]

[tool.uv]
package = false
